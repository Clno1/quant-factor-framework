<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <meta name="theme-color" content="#0E1117">
    <title>{{ title or "多因子量化研究" }}</title>

    <!-- Plotly.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_ver }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="brand">
                <span class="brand-badge">Q</span>
                <span>多因子量化</span>
            </a>
            <div class="nav-links">
                <a href="/factors"
                   {% if request.url.path.startswith('/factors') %} class="active"{% endif %}>因子库</a>
                <a href="/strategies"
                   {% if request.url.path.startswith('/strategies') %} class="active"{% endif %}>策略库</a>
                <a href="/watchlists"
                   {% if request.url.path.startswith('/watchlists') %} class="active"{% endif %}>Watchlist</a>
                <a href="/backtests"
                   {% if request.url.path.startswith('/backtests') %} class="active"{% endif %}>回测</a>
                <a href="/{% if universe %}?universe={{ universe }}{% endif %}"
                   {% if request.url.path == '/' or request.url.path.startswith('/factor/') or request.url.path.startswith('/backtest/') or request.url.path == '/backtest' %} class="active"{% endif %}>因子回测概览</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <span>多因子量化研究 · 深色仪表盘</span>
    </footer>

    <script src="/static/js/app.js?v={{ asset_ver }}"></script>
</body>
</html>
