<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <meta name="theme-color" content="#0E1117">
    <title>{{ title or "量化研究平台" }}</title>

    <!-- Plotly.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_ver }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="nav-progress" aria-hidden="true"></div>
    <div class="app-shell">
        <aside class="sidebar" aria-label="主导航">
            <a href="/" class="brand side-brand">
                <span class="brand-badge">Q</span>
                <span>
                    <strong>量化研究平台</strong>
                    <small>Research Console</small>
                </span>
            </a>

            <nav class="side-nav">
                <details class="side-group" open>
                    <summary class="side-group-title">因子</summary>
                    <div class="side-subnav">
                        <a href="/{% if universe %}?universe={{ universe }}{% endif %}"
                           class="side-link {% if request.url.path == '/' or request.url.path.startswith('/factor/') or request.url.path == '/backtest' or request.url.path.startswith('/backtest/') %}active{% endif %}">
                            <span>因子回测概览</span>
                        </a>
                        <a href="/factors"
                           class="side-link {% if request.url.path.startswith('/factors') %}active{% endif %}">
                            <span>因子库</span>
                        </a>
                    </div>
                </details>

                <details class="side-group" open>
                    <summary class="side-group-title">回测</summary>
                    <div class="side-subnav">
                        <a href="/strategies"
                           class="side-link {% if request.url.path.startswith('/strategies') %}active{% endif %}">
                            <span>策略库</span>
                        </a>
                        <a href="/backtests"
                           class="side-link {% if request.url.path.startswith('/backtests') %}active{% endif %}">
                            <span>回测任务</span>
                        </a>
                        <a href="/paper"
                           class="side-link {% if request.url.path.startswith('/paper') %}active{% endif %}">
                            <span>模拟盘</span>
                        </a>
                    </div>
                </details>

                <a href="/watchlists"
                   class="side-group-link {% if request.url.path.startswith('/watchlists') %}active{% endif %}">
                    <span>股票池</span>
                </a>

                <a href="/breakouts"
                   class="side-group-link {% if request.url.path.startswith('/breakouts') %}active{% endif %}">
                    <span>动量交易</span>
                </a>

                {% if group_analytics_enabled %}
                <a href="/group-analytics"
                   class="side-group-link {% if request.url.path.startswith('/group-analytics') %}active{% endif %}">
                    <span>行业/主题</span>
                </a>
                {% endif %}
            </nav>
        </aside>

        <div class="app-main">
            <main class="container">
                {% block content %}{% endblock %}
            </main>

            <footer class="site-footer">
                <span>量化研究平台 · Research Console</span>
            </footer>
        </div>
    </div>

    <script src="/static/js/app.js?v={{ asset_ver }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
