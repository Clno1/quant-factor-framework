<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <meta name="theme-color" content="#0E1117">
    <title>{{ title or "Multi-Factor Quant Research" }}</title>

    <!-- Plotly.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="brand">
                <span class="brand-badge">Q</span>
                <span>Multi-Factor Quant</span>
            </a>
            <div class="nav-links">
                <a href="/"{% if request.url.path == '/' %} class="active"{% endif %}>Overview</a>
                <a href="/backtest"{% if request.url.path.startswith('/backtest') %} class="active"{% endif %}>Backtest</a>
                <a href="/docs">API</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <span>Multi-Factor Quant Research · Dark Bloomberg-style Dashboard</span>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>
