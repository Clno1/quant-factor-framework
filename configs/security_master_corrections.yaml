    reason: "The SEC registrant history and 2026-03-16 Form 8-K establish a company-name and ticker change to GRML and state that the common-stock CUSIP remained unchanged; FMP nevertheless returned conflicting old/new issue identifiers."
    sources:
      - "https://www.sec.gov/Archives/edgar/data/1907223/000121390026028158/ea0281637-8k_greenland.htm"

