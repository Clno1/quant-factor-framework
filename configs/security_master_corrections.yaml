# Reviewed Security Master symbol transitions omitted by the FMP event feed.
#
# Every transition must identify exact provider profile fields and cite primary
# evidence. The loader rejects source-free entries, provider drift and pairs
# that do not share an issue-level CUSIP or ISIN.
schema_version: 1
universe: US_SECURITY_MASTER

reviewed_symbol_transitions:
