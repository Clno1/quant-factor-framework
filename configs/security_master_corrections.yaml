# Reviewed Security Master symbol transitions omitted by the FMP event feed.
#
# Every transition must identify exact provider profile fields and cite primary
# evidence. The loader rejects source-free entries, provider drift and pairs
# that do not share an issue-level CUSIP or ISIN.
schema_version: 2
universe: US_SECURITY_MASTER

# FMP can change issue identifiers across a documented rename even when SEC
# filings establish continuity. These entries authorize only the exact dated
# lineage edge; raw provider CUSIP/ISIN values remain unchanged and auditable.
reviewed_provider_identifier_conflicts:
  - id: albt_to_chga_sec_continuity
    effective_date: "2026-07-22"
    old_ticker: ALBT
    new_ticker: CHGA
    old_profile:
      name_contains: "Avalon GloboCare"
      asset_type: STOCK
      exchange: NASDAQ
      cik: "0001630212"
      isin: US05344R3021
      cusip: 05344R302
      listing_date: "2018-03-27"
      is_active: false
    new_profile:
      name_contains: "Change Agents"
      asset_type: STOCK
      exchange: NASDAQ
      cik: "0001630212"
      isin: US05344R4011
      cusip: 05344R401
      listing_date: "2026-07-22"
      is_active: true
    provider_event:
      company_name_contains: "Change Agents Corporation Common Stock"
    decision: SAME_LISTED_ISSUE
    reason: "The SEC registrant history and 2026-07-21 Form 8-K establish an ALBT-to-CHGA company-name and ticker change effective 2026-07-22 and explicitly state that common-stock CUSIP 05344R302 remained unchanged; FMP nevertheless assigned conflicting new CUSIP/ISIN values."
    sources:
      - "https://www.sec.gov/Archives/edgar/data/1630212/000121390026079830/ea0298573-8k_change.htm"
      - "https://www.sec.gov/Archives/edgar/data/1630212/000121390026090229/ea0301266-10q_change.htm"

  - id: klto_to_grml_sec_continuity
    effective_date: "2026-03-12"
    old_ticker: KLTO
    new_ticker: GRML
    old_profile:
      name_contains: "Klotho Neurosciences"
      asset_type: STOCK
      exchange: NASDAQ
      cik: "0001907223"
      isin: US49876K1034
      cusip: 49876K103
      listing_date: "2022-04-29"
      is_active: false
    new_profile:
      name_contains: "Greenland Mines"
      asset_type: STOCK
      exchange: NASDAQ
      cik: "0001907223"
      isin: US49876K2024
      cusip: 49876K202
      listing_date: "2022-04-29"
      is_active: true
    provider_event:
      company_name_contains: "Greenland Mines Ltd. Common Stock"
