    new_ticker: PARAA
    old_profile:
      name_contains: "Paramount Global"
      isin: US92556H1077
      cusip: 92556H107
      is_active: false
    new_profile:
      name_contains: "Paramount Global"
      isin: US92556H1077
      cusip: 92556H107
      is_active: false
