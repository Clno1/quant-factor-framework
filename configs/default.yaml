# ============================================================
# 多因子量化研究框架 - 默认配置
# 所有模块统一从此文件读取参数，避免硬编码
#
# 阅读提示：
#   1. universes / date_range / data 控制“数据准备”。
#   2. factors / preprocessing / ic_analysis / factor_confidence 控制“因子研究”。
#   3. backtest / backtest.execution / backtest.tradability 控制“回测成交假设”。
#   4. webapp 控制“网页服务和 outputs 读取位置”。
#   5. 不确定某个配置被谁使用时，用：
#        rg "配置名" src scripts
#      例如：rg "min_open_coverage" src scripts
# ============================================================

# 股票池
universe:
  # 旧字段（向后兼容，单一池场景）
  name: "SP500"                    # 默认主池：用于 /stock/{ticker} 分位排名参考
  custom_tickers: []
  sp500_url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
  cache_days: 7
  point_in_time:
    membership_dir: "data/pit_universes"   # 可放 SP500.parquet/csv，至少包含 date,ticker

# 多股票池配置（新版本，pipeline 会循环跑每一个）
universes:
  enabled:
    - SP500                        # 503 只 - 完整大盘统计
    - MAG7                         # 7 只 - 头部科技股快速参考
  default: "SP500"                 # Web 首页默认展示的池

# 回测时间范围
# 支持的写法：
#   - "today" / "yesterday"     动态值，每次调用解析为当前日期
#   - "5Y" / "3M" / "90D"       相对时间（N 年/月/日前）
#   - "2020-01-01"              具体 ISO 日期
date_range:
  start: "5Y"                      # 近 5 年
  end:   "today"                   # 直到今天（FMP 日线一般到昨天收盘）

# 数据下载
data:
  # ===== 数据源 =====
  provider: "fmp"                  # 当前仅支持 fmp（Financial Modeling Prep）

  # FMP (Financial Modeling Prep) 配置
  fmp:
    # API key 加载优先级：环境变量 FMP_API_KEY > 此处配置
    # 推荐用环境变量，避免提交到 git。在终端 `export FMP_API_KEY=xxx`
    api_key: ""                    # 环境变量未设置时回退到这里
    request_timeout: 30            # 单次请求超时秒数
    retry: 3                       # 失败重试次数（指数退避）

  raw_dir: "data/raw"
  processed_dir: "data/processed"
  chunk_size: 100                  # 进度条更新粒度（FMP 实际逐只请求）
  sleep_between: 0.0               # Premium 套餐不需要节流（750 req/min）
  max_workers: 1                   # 保留字段不使用
  retry_times: 3                   # 下载失败重试次数
  cache_days: 7                    # 本地缓存有效期（天），过期重新下载

# 因子预处理
preprocessing:
  winsorize_method: "mad"          # mad / 3sigma
  winsorize_n: 3                   # MAD 倍数
  standardize: true                # 是否做 Z-score 标准化
  neutralize_industry: false       # MVP 暂不启用，接口已预留
  neutralize_mcap: false           # 需要 data/processed/<UNIVERSE>/market_cap.parquet
  neutralize_min_obs: 30

# 单因子 IC 分析
ic_analysis:
  forward_periods: 5               # 前向收益窗口（交易日）
  method: "spearman"               # pearson / spearman（Rank IC 用 spearman）
  min_stocks: 10                   # 单日截面最少股票数，低于则跳过（生产 500 只池建议改 100）

# 因子置信评估
# 用于判断一个因子是否值得进入策略组合：预测力、稳定性、经济意义、可交易性、数据质量。
factor_confidence:
  enabled: true
  fdr_alpha: 0.10                  # 多因子同时检验时的 FDR 参考阈值
  score_weights:
    predictive: 0.35
    stability: 0.25
    economic: 0.20
    tradability: 0.10
    data_quality: 0.10
  thresholds:
    min_observations_pass: 120
    min_observations_watch: 60
    min_ic_mean_pass: 0.020
    min_ic_mean_watch: 0.010
    min_ic_ir_pass: 0.150
    min_ic_ir_watch: 0.070
    min_t_stat_pass: 2.0
    min_t_stat_watch: 1.5
    max_p_value_pass: 0.05
    max_p_value_watch: 0.10
    max_q_value_pass: 0.10
    max_q_value_watch: 0.20
    min_ic_positive_pct_pass: 0.52
    min_ic_positive_pct_watch: 0.50
    min_monthly_positive_pct_pass: 0.55
    min_monthly_positive_pct_watch: 0.50
    min_rolling_positive_pct_pass: 0.55
    min_rolling_positive_pct_watch: 0.50
    min_subperiod_positive_pct_pass: 0.67
    min_subperiod_positive_pct_watch: 0.34
    min_monotonic_corr_pass: 0.70
    min_monotonic_corr_watch: 0.30
    min_long_short_sharpe_pass: 0.50
    min_long_short_sharpe_watch: 0.20
    min_long_short_ann_return_pass: 0.02
    min_long_short_ann_return_watch: 0.00
    min_rank_autocorr_pass: 0.70
    min_rank_autocorr_watch: 0.40
    max_top_quantile_turnover_pass: 0.75
    max_top_quantile_turnover_watch: 0.90
    max_cost_bps_per_year_pass: 300
    max_cost_bps_per_year_watch: 800
    min_avg_coverage_pass: 0.80
    min_avg_coverage_watch: 0.60
    min_latest_coverage_pass: 0.80
    min_latest_coverage_watch: 0.60
    max_zero_std_pct_pass: 0.02
    max_zero_std_pct_watch: 0.05

# 五分位回测
backtest:
  n_groups: 5                      # 分组数（Quintile = 5）
  rebalance_mode: "month_end"      # every_n_days / month_end / week_end
  rebalance_days: 5                # 调仓周期（交易日）
  weight_method: "equal"           # 等权
  transaction_cost: 0.0005         # （已废弃，由 execution.commission_bps 替代）
  risk_free_rate: 0.0              # 年化无风险利率（计算 Sharpe 用）
  trading_days_per_year: 252
  require_point_in_time_universe: false    # true 时没有 PIT 成分股快照则拒绝回测

  # 成交模型（v3 新增）：让回测尽量接近实盘可达上限
  execution:
    timing: "next_open"            # next_open（推荐，T+1 开盘成交）/ close（旧行为，T 日收盘成交）
    portfolio_value: 100000        # 回测用来把权重交易换算成估算股数/订单金额；模拟盘用账户现金
    fee_model: "ibkr_us_pro_fixed" # simple_bps / ibkr_us_pro_fixed / ibkr_us_pro_tiered / ibkr_us_lite
    slippage_model: "volume_share" # constant_bps / volume_share / none
    slippage_bps: 5                # 兼容旧任务；constant_bps 或缺成交量时使用
    commission_bps: 2              # 兼容旧任务；simple_bps 费率
    min_open_coverage: 0.95        # next_open 下 open 价格矩阵最低非空覆盖率
    slippage:
      fallback_bps: 5              # volume 缺失时使用
      spread_bps: 2                # 近似半价差/开盘冲击基础成本
      volume_limit: 0.025          # 参考 Zipline/QuantConnect，单根 bar 可成交量上限 2.5%
      price_impact: 0.10           # impact = price_impact * min(qty/volume, volume_limit)^2
    fees:
      simple_bps: 2
      ibkr_us_pro_fixed:
        per_share: 0.005
        min_per_order: 1.00
        max_pct_trade_value: 0.01
      ibkr_us_pro_tiered:
        per_share: 0.0035
        min_per_order: 0.35
        max_pct_trade_value: 0.01
      ibkr_us_lite:
        per_share: 0.0
        min_per_order: 0.0
        max_pct_trade_value: 0.0
      regulatory:
        sec_sell_rate: 0.0000206
        finra_taf_per_share: 0.000195
        finra_taf_cap: 9.79
        finra_cat_per_share: 0.000003
      clearing:
        nscc_dtc_per_share: 0.00020
        nscc_dtc_cap_pct_trade_value: 0.005
      pass_through:
        nyse_rate_on_commission: 0.000175
        finra_rate_on_commission: 0.00056
      include_regulatory: true
      include_cat: true
      include_clearing: true
      include_pass_through: true
      exchange_fee_bps: 0.0        # 路由/交易所相关 maker-taker 先设 0，后续接真实路由后细分

  # 调仓日可交易过滤。规则在 T 日决策时应用；next_open 模式额外要求 T+1 开盘价可用。
  tradability:
    enabled: true
    min_price: 1.0
    min_dollar_volume: 1000000     # 过去 dollar_volume_window 日均成交额下限；0 表示关闭
    dollar_volume_window: 20
    min_valid_return_lookback: 20
    min_valid_return_ratio: 0.67
    require_next_open: true

# 当前启用因子（与研报 8 因子对齐）
factors:
  enabled:
    - MOM_1M       # 1 个月动量
    - MOM_3M       # 3 个月动量
    - MOM_6M       # 6 个月动量
    - MOM_12M      # 12 个月动量
    - VOL_20D      # 20 日波动率
    - VOL_60D      # 60 日波动率
    - REVERSAL     # 5 日短期反转
    - TURNOVER     # 20 日相对换手率

# 日志
logging:
  level: "INFO"                    # DEBUG / INFO / WARNING / ERROR
  log_dir: "logs"
  file_name: "quant.log"

# Web 服务
webapp:
  host: "0.0.0.0"                  # 0.0.0.0 允许手机访问
  port: 18823
  reload: false
  title: "多因子量化研究"
  output_dir: "outputs"            # 图表 / JSON 缓存目录
