# ============================================================
# 量化研究平台 - 默认配置
# 所有模块统一从此文件读取参数，避免硬编码
#
# 阅读提示：
#   1. research_universes / date_range / data 控制“数据准备”。
#   2. factors / preprocessing / ic_analysis / factor_confidence 控制“因子研究”。
#   3. backtest / backtest.execution / backtest.tradability 控制“回测成交假设”。
#   4. webapp 控制“网页服务和 outputs 读取位置”。
#   5. 不确定某个配置被谁使用时，用：
#        rg "配置名" src scripts
#      例如：rg "min_open_coverage" src scripts
# ============================================================

# 股票池
universe:
  custom_tickers: []
  sp500_url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
  cache_days: 7
  point_in_time:
    membership_dir: "data/pit_universes"   # 可放 SP500.parquet/csv，至少包含 date,ticker
    # 动态成分池：缺历史快照或历史股票行情时拒绝。
    required_universes:
      - SP500
      - NASDAQ100
      - SP500_MARKET_REGIME
      - US_LIQUID_5M
    static_universes: [MAG7]                # 明确固定不变的研究池，不要求 PIT 文件
    # 主多因子 PIT 使用固定起点，避免相对日期 "5Y" 每天前移后丢掉旧发布版本的基线快照。
    # 1990 年宽基顶底研究仍使用 market_regime_research.point_in_time.start，
    # 两条研究链不会共用或覆盖各自的诊断结论。
    main_factor_start: "2020-01-01"
    sp500_corrections: "configs/sp500_pit_corrections.yaml"
    nasdaq100_verification: "configs/nasdaq100_pit_verification.yaml"
    nasdaq100_corrections: "configs/nasdaq100_pit_corrections.yaml"

# 正式研究池角色注册表，也是预设股票池的唯一事实源。
# Watchlist 不在这里；它属于用户目标投资池。
research_universes:
  registry_path: "configs/research_universes.yaml"

# 回测时间范围
# 支持的写法：
#   - "today" / "yesterday"     动态值，每次调用解析为当前日期
#   - "5Y" / "3M" / "90D"       相对时间（N 年/月/日前）
#   - "2020-01-01"              具体 ISO 日期
date_range:
  start: "5Y"                      # 近 5 年
  end:   "today"                   # 直到今天（FMP 日线一般到昨天收盘）

# 数据下载
data:
  # ===== 数据源 =====
  provider: "fmp"                  # 当前仅支持 fmp（Financial Modeling Prep）

  # FMP (Financial Modeling Prep) 配置
  fmp:
    # API key 加载优先级：环境变量 FMP_API_KEY > 此处配置
    # 推荐用环境变量，避免提交到 git。在终端 `export FMP_API_KEY=xxx`
    api_key: ""                    # 环境变量未设置时回退到这里
    request_timeout: 30            # 单次请求超时秒数
    retry: 3                       # 失败重试次数（指数退避）
    # EOD bulk 文件体积较大，逐交易日主动限速，避免首次增量窗口触发 429。
    bulk_request_interval_seconds: 10

  raw_dir: "data/raw"

  # DuckDB 保存版本目录、质量结果和发布指针；大体量行情使用不可变 Parquet。
  # 每日任务是唯一写入者，研究/回测/模拟盘只读取 published_versions。
  foundation:
    catalog_path: "data/catalog/quant.duckdb"
    lake_dir: "data/lake"
    close_delay_minutes: 120       # XNYS 正式收盘后等待 FMP 日线稳定
    overlap_calendar_days: 21      # 增量更新时回看，吸收复权与供应商修订
    min_latest_coverage: 0.98      # 目标交易日当前成分股行情覆盖率门槛
    min_pit_daily_coverage: 0.95   # 历史每个 session 的 PIT 成分行情最低覆盖率
    max_workers: 6                 # FMP 单票历史接口并发数
    # 研究、网页回测和模拟盘禁止直接调用 FMP。
    # 缺数通过 SQLite 请求队列交给唯一 MarketDataWriter 处理。
    request_poll_seconds: 15
    request_stale_minutes: 30
    custom_universe_min_coverage: 1.0

  # 全美证券主表。默认构建命令只产出候选和审计报告；只有显式
  # --publish 且所有质量门禁通过时，才推进 DuckDB 正式指针。
  security_master:
    snapshot_dir: "data/lake/security_master"
    corrections: "configs/security_master_corrections.yaml"
    history_policy: "configs/research_history_policy.yaml"
    history_start: "2019-01-01"
    profile_parts: [0, 1, 2, 3]
    symbol_change_limit: 10000
    delisted_page_size: 100
    delisted_max_pages: 100
    minimum_active_stocks: 3000
    minimum_name_coverage: 0.99
    minimum_classification_coverage: 0.95

  # 全美行情覆盖层。历史回填按证券批次和年份落 Parquet，避免把完整
  # coverage 宽表载入内存；正式发布必须绑定一个 Security Master generation。
  broad_coverage:
    name: "US_EQUITY_COVERAGE"
    methodology_version: "BROAD_COVERAGE_V2_QUARANTINE"
    history_start: "2019-01-01"
    shard_size: 100
    max_workers: 2
    min_target_coverage: 0.98
    # FMP 原始坏行只允许进入公开隔离台账，禁止修价或进入研究数据。
    # 任一比例越界时整次发布继续 fail-closed。
    max_bar_quarantine_ratio: 0.0005
    max_target_bar_quarantine_ratio: 0.005
    allowed_asset_types: [STOCK, ADR]
    benchmark_tickers: [SPY, QQQ, IWM]
    candidate_dir: "data/lake/staging/us_equity_coverage"
    partition_frequency: "month"

  # 由 coverage 行情派生的 PIT 宽基比较池。普通日复用最近月末快照；
  # 退市从最后可交易日后的首个 XNYS session 起强制退出。
  broad_universe:
    name: "US_LIQUID_5M"
    history_start: "2019-01-01"
    research_start: "2020-01-01"
    min_price: 1.0
    min_adv20_usd: 5000000.0
    adv_sessions: 20
    min_valid_sessions: 15
    include_adr: false
    methodology_version: "US_LIQUID_5M_PIT_V2_COMPACT_EVENTS"
    snapshot_dir: "data/lake/universes"

  # 宽基因子数据与完整 IC/置信研究分开发布。首次回填和日常增量都按
  # 因子 x 月份串行计算，避免在 2 GB SG 上构造全历史全股票宽表。
  broad_factor_data:
    universe: "US_LIQUID_5M"
    output_dir: "outputs/universes/US_LIQUID_5M/factor_data"
    # 五个不同交易日的 SG 影子核验通过后才改为 true。false 时页面仍可
    # 显式选择宽基池验收，但不会自动替代标普 500 成为默认比较池。
    web_default_enabled: false
    methodology_version: "BROAD_FACTOR_DATA_V1"
    preprocessing_methodology_version: "FACTOR_CLEAN_V1"
    partition_frequency: "month"
    minimum_latest_raw_coverage: 0.95
    minimum_latest_clean_coverage: 0.95
    maximum_zero_std_cross_section_ratio: 0.02
    checkpoint_dir: "data/lake/staging/broad_factor_data"

  # 正式宽基 IC/ICIR、置信评估和成本回测的发布门槛。当前 FMP profile
  # 只有最新行业快照，因此会被 readiness 检查明确阻断；不能用降低阈值
  # 或关闭行业中性化的方式绕过。
  broad_factor_research:
    universe: "US_LIQUID_5M"
    output_dir: "outputs/universes/US_LIQUID_5M/research"
    minimum_evaluable_sessions: 756
    minimum_cross_section: 500
    minimum_pit_industry_coverage: 0.95
    accepted_classification_policies: [PIT_EFFECTIVE_DATED]

  # US_ACTIVE 是供应商当前快照；正式发布后使用语义更准确的名称。
  liquid_universe:
    name: "US_LIQUID_5M"
    source_universe: "US_ACTIVE"
    asset_type: "STOCK"
    min_current_dollar_volume_m: 5.0
    always_tickers: [QQQ, SPY, IWM]
    initial_start: "180D"

# 可变业务对象使用 SQLite；大型行情、因子和结果仍使用 DuckDB + Parquet。
# SQLite 是唯一业务主存储；旧 JSON/Parquet 仅保留为只读归档。
storage:
  sqlite_path: "outputs/quant_app.sqlite3"

# 大盘顶底研究。该模块先生成可审计研究产物，不直接驱动页面或交易。
# 完整模式强制使用 point-in-time 成分股；缺失时只能显式运行 --core-only。
market_regime_research:
  enabled: true
  primary_symbol: "^GSPC"          # 顶底标签基准；纳指作为并行特征，不混用标签
  end: "today"
  raw_dir: "data/raw/market_regime"
  output_dir: "outputs/market_regime_research"

  # start 应从标的上市/可得日起设置。FMP 单次最多约 5000 行，代码会分段下载并校验。
  instruments:
    - {symbol: "^GSPC", start: "1990-01-01", kind: "index"}
    - {symbol: "^NDX",  start: "1990-01-01", kind: "index"}
    - {symbol: "SPY",   start: "1993-01-29", kind: "etf"}
    - {symbol: "QQQ",   start: "1999-03-10", kind: "etf"}
    - {symbol: "IWM",   start: "2000-05-26", kind: "etf"}
    - {symbol: "HYG",   start: "2007-04-11", kind: "etf"}
    - {symbol: "LQD",   start: "2002-07-30", kind: "etf"}

  point_in_time:
    universe: "SP500"                  # 研究语义；来源仍是 S&P 500
    data_universe: "SP500_MARKET_REGIME" # 专属 DuckDB/Curated 长历史版本
    publication_id: "SP500_MARKET_REGIME" # 专属 PIT 文件，禁止覆盖主因子 SP500
    start: "1990-01-01"
    strict: true
    min_snapshot_members: 450      # 含多股类和临时过渡，不能机械要求正好 500
    max_snapshot_members: 550

  labels:
    horizons: [5, 20, 60]
    volatility_window: 20
    high_lookback: 252
    top_near_high_pct: 0.03
    bottom_min_drawdown_pct: 0.10
    bottom_drawdown_quantile: 0.20
    bottom_quantile_lookback: 1260
    minimum_history: 252
    barrier_vol_multiplier: 1.0
    minimum_barrier_pct: 0.02

  features:
    moving_average_windows: [20, 50, 60, 120, 200]
    breadth_change_windows: [5, 20]
    realized_volatility_windows: [20, 60]
    correlation_window: 60
    correlation_min_members: 30
    momentum_lookback: 252
    momentum_skip: 21              # 12-1 动量，跳过最近约一个月
    momentum_quantile: 0.10
    min_cross_section_members: 30
    min_cross_section_coverage: 0.95 # 每日有效行情至少覆盖 95% 当日 PIT 成分股

  # 有效性筛选。2022 年起的数据封存，不参与候选发现或参数选择。
  screening:
    candidate_registry: "configs/market_regime_screening_candidates_v2.yaml"
    holdout_start: "2022-01-01"
    first_validation_start: "1996-01-01"
    validation_years: 2
    minimum_train_years: 5
    embargo_sessions: 60            # 与最长标签窗口相同，阻断跨 fold 的未来收益泄漏
    minimum_train_rows: 252
    minimum_validation_rows: 40
    minimum_train_positives: 10
    minimum_validation_positives: 2
    minimum_fold_count: 3
    minimum_event_episodes: 30
    minimum_regime_eras: 3
    minimum_feature_coverage: 0.95
    direction_consistency: 0.75
    fdr_q: 0.10
    winsor_lower_quantile: 0.01
    winsor_upper_quantile: 0.99
    signal_quantile: 0.90
    ridge_penalty: 0.0001
    calibration_bins: 10
    bootstrap_iterations: 1000
    bootstrap_block_rows: 60        # 目标标签有效状态中的连续观测；不是 60 个固定日历交易日
    random_seed: 20260802
    scan_unregistered: true          # 未登记特征保留探索记录，但不能进入正式短名单

# 动量交易提醒
# Discord Webhook 等密钥只从环境变量或 .env.local 读取，不写在这里。
momentum_alerts:
  universe: "US_ACTIVE"
  exchange: "NASDAQ"
  # 盘前日报与刷新任务共同读取的低流动性例外；不要分散写进两个 env 文件。
  always_tickers: []
  asset_types:
    include_etfs: false             # Discord 告警默认仅扫描股票；网页 US_ACTIVE 仍保留 ETF
  broad_scan:
    min_return_20d: 10.0           # 盘前宽筛，给盘中上涨留出进入严格筛选的空间
    min_adr_20d: 4.5
    min_current_dollar_volume_m: 5.0

  daily_data:
    min_exact_coverage: 0.80       # 必须精确截至上一 XNYS 交易日，否则关闭信号
    min_avg_dollar_volume_m: 10.0
    max_symbols: 600
  strict_scan:
    min_return_20d: 20.0
    min_adr_20d: 6.0
    min_dollar_volume_m: 10.0
    min_avg_dollar_volume_m: 10.0
  quotes:
    chunk_size: 100
  intraday:
    enabled: false                 # 影子阶段先关闭；稳定后只对严格候选开启
    interval: 5
    max_symbols: 25
    lookback_days: 3
  notifications:
    max_rows: 10
    mention_levels: ["READY", "BREAKOUT", "OPENING_RANGE_BREAK"]
    send_empty_digest: false

# 独立盘中动量监控。当前只允许 shadow；不会从这里开启 Discord 或自动下单。
intraday_momentum_monitor:
  enabled: true                         # 进程仍由 systemd timer 控制；初始只运行 shadow
  asset_types:
    include_etfs: false

  universe:
    name: US_ACTIVE
    max_symbols: 600
    refresh_minutes: 5
    active_max_symbols: 40
    active_hard_limit: 60
    quote_chunk_size: 100

  broad_scan:
    min_return_20d: 10.0
    min_adr_20d: 4.5
    min_current_dollar_volume_m: 5.0

  strict_scan:
    min_return_20d: 20.0
    min_adr_20d: 6.0
    min_dollar_volume_m: 10.0
    min_avg_dollar_volume_m: 10.0

  bars:
    interval_minutes: 1
    stale_after_seconds: 90
    preload_bars: 60

  opening_range:
    windows: [5, 15]              # 仅影子观测；正式触发仍保留既有 60/30 分钟语义

  runtime:
    max_concurrent_requests: 4
    heartbeat_seconds: 30
    poll_offset_seconds: 8
    exact_confirm_cooldown_seconds: 50
    timezone: America/New_York

  notifications:
    cooldown_minutes: 20
    delivery_enabled: false             # 生产由独立 env 覆盖，且仍需通过五日晋级闸门
    max_delivery_attempts: 3
    max_messages_per_cycle: 5
    send_empty: false

  observation:
    required_sessions: 5
    min_cycle_coverage: 0.85
    max_error_cycle_ratio: 0.05
    max_cycle_p95_seconds: 30.0

# 美股盘前双频道日报。momentum 与 sector rotation 使用独立 Webhook。
# 这是单向编排层；因子、回测、模拟盘、alerts 和 group_analytics 均不依赖它。
premarket_digest:
  enabled: false
  timezone: America/New_York
  scheduled_window_start: "09:20"
  scheduled_window_end: "09:29"

  momentum:
    enabled: true
    universe: US_ACTIVE
    include_etfs: false
    max_rows: 10
    min_exact_asof_coverage: 0.80
    # 至少 65 根（约 3 个月）且恰好截至 T-1 的可计算标的覆盖率。
    min_evaluable_coverage: 0.80

  sector_rotation:
    enabled: true                       # 与 momentum 共用盘前 timer，但投递到独立频道
    universe: SP500
    taxonomy: FMP
    # 正式推送门槛高于单次 group writer 的最低发布门槛。
    min_coverage: 0.98
    sector_top_n: 3
    sector_bottom_n: 3
    sub_industry_top_n: 5
    sub_industry_bottom_n: 5

# 因子预处理
preprocessing:
  winsorize_method: "mad"          # mad / 3sigma
  winsorize_n: 3                   # MAD 倍数
  standardize: true                # 是否做 Z-score 标准化
  neutralize_industry: true        # 默认开启行业中性化，剥离 sector 暴露后再做最终 Z-score
  neutralize_mcap: false           # 需要真实 PIT 市值序列；当前发布版本尚未提供，不能用当前市值制造未来信息
  neutralize_min_obs: 30

# 单因子 IC 分析
ic_analysis:
  forward_periods: 5               # 前向收益窗口（交易日）
  method: "spearman"               # pearson / spearman（Rank IC 用 spearman）
  min_stocks: 10                   # 单日截面最少股票数，低于则跳过（生产 500 只池建议改 100）

# 因子置信评估
# 用于判断一个因子是否值得进入策略组合：预测力、稳定性、经济意义、可交易性、数据质量。
factor_confidence:
  enabled: true
  fdr_alpha: 0.10                  # 多因子同时检验时的 FDR 参考阈值
  score_weights:
    predictive: 0.35
    stability: 0.25
    economic: 0.20
    tradability: 0.10
    data_quality: 0.10
  thresholds:
    min_observations_pass: 120
    min_observations_watch: 60
    min_ic_mean_pass: 0.020
    min_ic_mean_watch: 0.010
    min_ic_ir_pass: 0.150
    min_ic_ir_watch: 0.070
    min_t_stat_pass: 2.0
    min_t_stat_watch: 1.5
    max_p_value_pass: 0.05
    max_p_value_watch: 0.10
    max_q_value_pass: 0.10
    max_q_value_watch: 0.20
    min_ic_positive_pct_pass: 0.52
    min_ic_positive_pct_watch: 0.50
    min_monthly_positive_pct_pass: 0.55
    min_monthly_positive_pct_watch: 0.50
    min_rolling_positive_pct_pass: 0.55
    min_rolling_positive_pct_watch: 0.50
    min_subperiod_positive_pct_pass: 0.67
    min_subperiod_positive_pct_watch: 0.34
    min_monotonic_corr_pass: 0.70
    min_monotonic_corr_watch: 0.30
    min_long_short_sharpe_pass: 0.50
    min_long_short_sharpe_watch: 0.20
    min_long_short_ann_return_pass: 0.02
    min_long_short_ann_return_watch: 0.00
    min_rank_autocorr_pass: 0.70
    min_rank_autocorr_watch: 0.40
    max_top_quantile_turnover_pass: 0.75
    max_top_quantile_turnover_watch: 0.90
    max_cost_bps_per_year_pass: 300
    max_cost_bps_per_year_watch: 800
    min_avg_coverage_pass: 0.80
    min_avg_coverage_watch: 0.60
    min_latest_coverage_pass: 0.80
    min_latest_coverage_watch: 0.60
    max_zero_std_pct_pass: 0.02
    max_zero_std_pct_watch: 0.05

# 五分位回测
backtest:
  n_groups: 5                      # 分组数（Quintile = 5）
  rebalance_mode: "month_end"      # every_n_days / month_end / week_end
  rebalance_days: 5                # 调仓周期（交易日）
  weight_method: "equal"           # 等权
  transaction_cost: 0.0005         # （已废弃，由 execution.commission_bps 替代）
  risk_free_rate: 0.0              # 年化无风险利率（计算 Sharpe 用）
  trading_days_per_year: 252
  require_point_in_time_universe: true     # 对 point_in_time.required_universes 强制 PIT 校验

  # 成交模型（v3 新增）：让回测尽量接近实盘可达上限
  execution:
    timing: "next_open"            # 强制 T+1 开盘成交；同日 close 成交已禁用
    # PIT 成分在两次调仓间退出时立即卖出；若已停牌/退市而无下一开盘，
    # 使用最后可交易收盘价结算，扣完整卖出成本，原权重留作现金到下次调仓。
    membership_exit_policy: "next_open_or_last_close_to_cash"
    portfolio_value: 100000        # 回测用来把权重交易换算成估算股数/订单金额；模拟盘用账户现金
    fee_model: "ibkr_us_pro_fixed" # simple_bps / ibkr_us_pro_fixed / ibkr_us_pro_tiered / ibkr_us_lite
    slippage_model: "volume_share" # constant_bps / volume_share / none
    slippage_bps: 5                # 兼容旧任务；仅供 constant_bps 模型使用
    commission_bps: 2              # 兼容旧任务；simple_bps 费率
    min_open_coverage: 0.95        # next_open 下 open 价格矩阵最低非空覆盖率
    slippage:
      fallback_bps: 5              # 底层模型兼容值；标准回测/模拟盘缺成交量会直接失败
      spread_bps: 2                # 近似半价差/开盘冲击基础成本
      volume_limit: 0.025          # 参考 Zipline/QuantConnect，单根 bar 可成交量上限 2.5%
      adv_window: 20               # T+1 开盘只能使用截至 T 日的过去 20 日平均成交量
      price_impact: 0.10           # impact = price_impact * min(qty/volume, volume_limit)^2
    fees:
      simple_bps: 2
      ibkr_us_pro_fixed:
        per_share: 0.005
        min_per_order: 1.00
        max_pct_trade_value: 0.01
      ibkr_us_pro_tiered:
        per_share: 0.0035
        min_per_order: 0.35
        max_pct_trade_value: 0.01
      ibkr_us_lite:
        per_share: 0.0
        min_per_order: 0.0
        max_pct_trade_value: 0.0
      regulatory:
        sec_sell_rate: 0.0000206
        finra_taf_per_share: 0.000195
        finra_taf_cap: 9.79
        finra_cat_per_share: 0.000003
      clearing:
        nscc_dtc_per_share: 0.00020
        nscc_dtc_cap_pct_trade_value: 0.005
      pass_through:
        nyse_rate_on_commission: 0.000175
        finra_rate_on_commission: 0.00056
      include_regulatory: true
      include_cat: true
      include_clearing: true
      include_pass_through: true
      exchange_fee_bps: 0.0        # 路由/交易所相关 maker-taker 先设 0，后续接真实路由后细分

  # 调仓日可交易过滤。全部规则只使用 T 日收盘前已知数据；
  # T+1 开盘价由成交引擎在执行阶段强制校验。
  tradability:
    enabled: true
    min_price: 1.0
    min_dollar_volume: 1000000     # 过去 dollar_volume_window 日均成交额下限；0 表示关闭
    dollar_volume_window: 20
    min_valid_return_lookback: 20
    min_valid_return_ratio: 0.67

# 当前启用因子（与研报 8 因子对齐）
factors:
  enabled:
    - MOM_1M       # 1 个月动量
    - MOM_3M       # 3 个月动量
    - MOM_6M       # 6 个月动量
    - MOM_12M      # 12 个月动量
    - VOL_20D      # 20 日波动率
    - VOL_60D      # 60 日波动率
    - REVERSAL     # 5 日短期反转
    - TURNOVER     # 20 日相对换手率

# 日志
logging:
  level: "INFO"                    # DEBUG / INFO / WARNING / ERROR
  log_dir: "logs"
  file_name: "quant.log"

# Web 服务
webapp:
  host: "127.0.0.1"                # 对外监听必须配置 QUANT_WEB_AUTH_USER/PASSWORD
  port: 18823
  reload: false
  title: "量化研究平台"
  output_dir: "outputs"            # 图表 / JSON 缓存目录

# 行业/主题分析（阶段 1 默认关闭；通过影子运行 Gate 后再开放页面）
# 该模块是独立领域，不会隐式进入因子、回测或模拟盘。
group_analytics:
  enabled: false
  # 与 writer 分离；影子期可 enabled=true、web_enabled=false。
  web_enabled: false
  default_universe: SP500
  universes: [SP500]
  output_subdir: "universes"

  classification:
    default_taxonomy: FMP
    default_level: sector
    require_pit_for_current_snapshot: false
    security_master_path: "data/reference/security_master.parquet"
    pit_classification_root: "data/pit_classifications"
    theme_exposure_root: "data/theme_exposures"
    issuer_override_path: "configs/classifications/issuer_overrides.yaml"
    group_id_mapping_path: "configs/classifications/fmp_group_ids.yaml"
    counting_unit: security_with_overrides
    include_etfs: false
    min_theme_exposure: 0.20

  history:
    enabled: false
    require_point_in_time_universe: true
    require_point_in_time_classification: true

  benchmarks:
    SP500: SPY
    US_ACTIVE: VTI

  # 单次工程发布门槛；98% 是后续 10 个交易日 Production Release Gate。
  inputs:
    min_return_coverage: 0.80
    require_benchmark: false

  daily_return:
    headline_method: ROBUST_EW
    winsorize_method: mad
    winsorize_n: 3.0
    min_members_for_winsorize: 5
    unchanged_band_bps: 1

  ranking:
    top_n: 5
    bottom_n: 5
    min_members: 5
    min_count_coverage: 0.80
    min_freshness_coverage: 0.80
    allowed_quality_grades: [A, B]
    single_name_concentration_warning: 0.35

  # 阶段 1 仅发布 nullable CAP Schema，不执行本段算法。
  cap_weight:
    preferred_type: free_float
    max_constituent_weight: 0.25
    min_availability_coverage: 0.80
    min_return_coverage: 0.90
    allow_silent_equal_weight_fallback: false

  index_series:
    enabled: false
    min_count_coverage: 0.80
    min_cap_return_coverage: 0.90
    capped_rebalance_frequency: month_end

  live:
    enabled: false
    interval_minutes: 15
    quote_chunk_size: 100
    max_quote_age_seconds: 300
    max_future_clock_skew_seconds: 60
    max_snapshot_span_seconds: 120
    start_et: "09:45"
    end_et: "15:55"
    timezone: America/New_York

  rvol:
    enabled: false
    interval_minutes: 5
    lookback_sessions: 20
    min_history_sessions: 10
    min_group_coverage: 0.60
    lower_clip: 0.20
    upper_clip: 5.00

  momentum:
    enabled: false
    benchmark: auto
    production_score_id: null
    research_return_methods: [CAP_FF, CAP_TOTAL, CAPPED_CAP_FF_M]
    lookback_6m: 126
    lookback_12m: 252
    skip_days: 21
    weight_6m: 0.50
    weight_12m: 0.50
    min_window_coverage: 0.95
    annualized_volatility_floor: 0.05
    min_groups_for_zscore: 5
    std_epsilon: 1.0e-12
    z_clip: 3.0

  overlays:
    industry:
      enabled: false
      lambda: 0.0
      application_stage: post_neutralization
    theme:
      enabled: false
      lambda: 0.0
      application_stage: post_neutralization

  freshness:
    eod_publish_sla_minutes: 180
    live_stale_after_minutes: 30

  heatmap:
    default_abs_limit: 0.05
