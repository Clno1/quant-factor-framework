# Reviewed corrections for provider omissions in the NASDAQ-100 PIT event log.
#
# Each entry is an exact, dated index event supported by primary sources. The
# loader rejects broad ticker aliases, duplicate events, and source-free edits.
# Current-snapshot correction is permitted only when Nasdaq's official list
# independently shows the exact addition or removal.
schema_version: 1
universe: NASDAQ100

reviewed_events:
  - id: xlnx_acquisition_reason
    effective_date: "2022-02-22"
    added_ticker: AZN
    removed_ticker: XLNX
    added_security: "AstraZeneca plc (ADR)"
    removed_security: "Xilinx Inc"
    corrected_reason: "Xilinx was acquired by AMD in an all-stock merger completed on 2022-02-14; AZN replaced XLNX in the Nasdaq-100 effective 2022-02-22."
    provider_event:
      added_ticker: AZN
      removed_ticker: XLNX
      reason_contains: "Annual Re-ranking"
      removed_security_contains: "Xilinx"
    sources:
      - "https://ir.nasdaq.com/news-releases/news-release-details/astrazeneca-plc-adr-join-nasdaq-100-index-beginning-february-22"
