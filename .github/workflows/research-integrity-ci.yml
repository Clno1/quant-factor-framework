name: research-integrity-ci

on:
  pull_request:
  push:
    branches:
      - fix/research-integrity-20260822

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Research integrity regression tests
        run: >-
          python -m pytest -q
          tests/test_research_integrity_repairs.py
          tests/test_benchmark_contract_integration.py
          tests/test_membership_exit_price_semantics.py
          tests/test_ic_hac_confidence.py
      - name: Existing trading integrity tests
        run: python -m pytest -q tests/test_trading_integrity.py
      - name: Related regression suite
        run: >-
          python -m pytest -q
          tests/test_preprocessing_audit.py
          tests/test_data_foundation.py
          tests/test_strategy_composition_integrity.py
          tests/test_run_mvp_cli.py
          tests/test_web_backtest_detail.py
          tests/test_decision_replay.py
